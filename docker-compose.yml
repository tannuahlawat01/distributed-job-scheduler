version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: jobscheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobscheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job-scheduler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: job-scheduler-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://jobuser:jobpass@postgres:5432/jobscheduler
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: ./scheduler
    container_name: job-scheduler-scheduler
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://jobuser:jobpass@postgres:5432/jobscheduler
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./scheduler:/app
      - /app/node_modules

  worker:
    build: ./worker
    environment:
      - DATABASE_URL=postgresql://jobuser:jobpass@postgres:5432/jobscheduler
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - /app/node_modules
    deploy:
      replicas: 2

volumes:
  postgres_data: